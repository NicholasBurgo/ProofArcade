<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }</style>
<title>Proof Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-hud.css">
<link rel="stylesheet" href="css/03-home.css">
<link rel="stylesheet" href="css/04-sheet.css">
<link rel="stylesheet" href="css/05-page.css">
<link rel="stylesheet" href="css/06-proofs.css">
<link rel="stylesheet" href="css/07-check.css">
<link rel="stylesheet" href="css/08-ask.css">
<link rel="stylesheet" href="css/09-marks.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <button class="wordmark" id="home" type="button">Proof Arcade</button>
    <div class="tools">
      <button class="tool" id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>
  <main id="view"><p class="loading">Shuffling the deck…</p></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="ink" aria-hidden="true"></canvas>
<div class="ink-tools" id="ink-tools" hidden>
  <button class="ink-clear" id="ink-erase" type="button" aria-pressed="false">Eraser</button>
  <button class="ink-clear" id="ink-clear" type="button">Clear ink</button>
</div>

<script>
window.MathJax = {
  // html: \class, to underline where a checked proof went wrong in the worked one (js/08)
  loader: { load: ['[tex]/html'] },
  tex: { packages: { '[+]': ['html'] } },
  startup: { typeset: false },
  options: { enableMenu: false },
  svg: { fontCache: 'local' },
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"></script>
<script src="js/01-setup.js"></script>
<script src="js/02-progress.js"></script>
<script src="js/03-sound.js"></script>
<script src="js/04-confetti.js"></script>
<script src="js/05-ink.js"></script>
<script src="js/06-math.js"></script>
<script src="js/07-hud.js"></script>
<script src="js/08-proofs.js"></script>
<script src="js/09-home.js"></script>
<script src="js/10-rounds.js"></script>
<script src="js/11-question.js"></script>
<script src="js/12-pen-mode.js"></script>
<script src="js/13-results.js"></script>
<script src="js/14-check-writing.js"></script>
<script src="js/14b-ask.js"></script>
<script src="js/14c-marks.js"></script>
<script src="js/15-boot.js"></script>

</body>
</html>
